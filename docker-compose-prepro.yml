version: '3.8'
name: capacitaciones-m-prepro

services:
  prepro-db:
    image: mysql:8.0
    container_name: prepro-capacitaciones-m-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    env_file:
      - .env
    ports:
      - "127.0.0.1:3350:3306"
    volumes:
      - prepro-mysql-data:/var/lib/mysql
    networks:
      - prepro-capacitaciones-m

  prepro-api:
    image: ghcr.io/inntek15dev-lang/capacitaciones-m-api:latest
    container_name: prepro-capacitaciones-m-api
    restart: always
    environment:
      - APP_ENV=prepro
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT}
      - FRONT_URL=${FRONT_URL}
    env_file:
      - .env
    ports:
      - "127.0.0.1:4050:4050"
    depends_on:
      - prepro-db
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:' + (process.env.PORT || 4050) + '/', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - prepro-capacitaciones-m

  prepro-frontend:
    image: ghcr.io/inntek15dev-lang/capacitaciones-m-front:latest
    container_name: prepro-capacitaciones-m-front
    restart: always
    environment:
      - APP_ENV=prepro
      - VITE_APP_ENV=prepro
      - VITE_API_URL=https://prepro-capacitaciones-m-api.ovalcontrol.com/api/v1
    ports:
      - "127.0.0.1:8050:80"
    depends_on:
      - prepro-api
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - prepro-capacitaciones-m

networks:
  prepro-capacitaciones-m:
    driver: bridge

volumes:
  prepro-mysql-data:
