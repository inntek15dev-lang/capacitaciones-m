version: '3.8'
name: capacitaciones-m-prod

services:
  db:
    image: mysql:8.0
    container_name: capacitaciones-m-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    env_file:
      - .env
    ports:
      - "127.0.0.1:3351:3306"
    volumes:
      - prod-mysql-data:/var/lib/mysql
    networks:
      - capacitaciones-m

  api:
    image: ghcr.io/inntek15dev-lang/capacitaciones-m-api:latest
    container_name: capacitaciones-m-api
    restart: always
    environment:
      - APP_ENV=prod
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - PORT=${PORT}
      - FRONT_URL=${FRONT_URL}
    env_file:
      - .env
    ports:
      - "127.0.0.1:4051:4051"
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:' + (process.env.PORT || 4051) + '/', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - capacitaciones-m

  frontend:
    image: ghcr.io/inntek15dev-lang/capacitaciones-m-front:latest
    container_name: capacitaciones-m-front
    restart: always
    environment:
      - APP_ENV=prod
      - VITE_APP_ENV=prod
      - VITE_API_URL=https://capacitaciones-m-api.ovalcontrol.com/api/v1
    ports:
      - "127.0.0.1:8051:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - capacitaciones-m

networks:
  capacitaciones-m:
    driver: bridge

volumes:
  prod-mysql-data:
