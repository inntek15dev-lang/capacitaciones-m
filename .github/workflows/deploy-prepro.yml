name: CI/CD CAPACITACIONES-M - Preprod

on:
  push:
    branches: [ "prepro" ]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}-api
  IMAGE_FRONT: ghcr.io/${{ github.repository }}-front

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Log in al GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: ./back/Dockerfile.back
          push: true
          tags: ${{ env.IMAGE_API }}:latest

      - name: Create Frontend .env file
        run: |
          echo "VITE_API_URL=https://prepro-capacitaciones-m-api.ovalcontrol.com/api/v1" > ./front/.env
          echo "Frontend .env created with API URL: \$(cat ./front/.env)"
        # La URL del API debe ser la de preproducción.

      - name: Build y Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile.front
          push: true
          tags: ${{ env.IMAGE_FRONT }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Fix permissions on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /home/DOCKERS-PREPROD/CAPACITACIONES-M/
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} /home/DOCKERS-PREPROD/CAPACITACIONES-M/
            sudo chmod -R 775 /home/DOCKERS-PREPROD/CAPACITACIONES-M/
            
            # Asegurar existencia y permisos del directorio de respaldos
            sudo chmod +x /home/inntek
            sudo mkdir -p /home/inntek/backups/db/capacitaciones-m/
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} /home/inntek/backups/
            sudo chmod -R 775 /home/inntek/backups/

      - name: Copiar docker-compose al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-prepro.yml"
          target: "/home/DOCKERS-PREPROD/CAPACITACIONES-M/"
          overwrite: true

      - name: Ejecutar despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/DOCKERS-PREPROD/CAPACITACIONES-M
            
            # Login en el registro de GitHub
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # --- Respaldar Base de Datos ---
            if [ -f .env ]; then
              export $(grep -v '^#' .env | xargs)
            fi
            
            DB_CONTAINER="prepro-capacitaciones-m-db"
            BACKUP_DIR="/home/inntek/backups/db/capacitaciones-m"
            DATE_STR=$(date +"%d-%m-%y")
            
            if docker ps --format '{{.Names}}' | grep -Eq "^${DB_CONTAINER}$"; then
              echo "Iniciando respaldo de base de datos..."
              
              # Buscar backup last-0 existente y rotarlo a last-1
              EXISTING_LAST0=$(find "$BACKUP_DIR" -name "backup-db-capacitaciones-m-*-last-0.sql" -type f | head -n 1)
              if [ -n "$EXISTING_LAST0" ]; then
                NEW_LAST1="${EXISTING_LAST0/-last-0.sql/-last-1.sql}"
                rm -f "$NEW_LAST1"
                mv "$EXISTING_LAST0" "$NEW_LAST1"
                echo "Rotado respaldo anterior a: $(basename "$NEW_LAST1")"
              fi
              
              # Limpiar respaldos last-1 antiguos para conservar un máximo de 2
              find "$BACKUP_DIR" -name "backup-db-capacitaciones-m-*-last-1.sql" -type f | grep -v "${NEW_LAST1:-__none__}" | xargs rm -f 2>/dev/null || true
              
              # Generar nuevo backup last-0
              NEW_BACKUP="${BACKUP_DIR}/backup-db-capacitaciones-m-${DATE_STR}-last-0.sql"
              docker exec "$DB_CONTAINER" mysqldump -u root -p"${DB_ROOT_PASSWORD}" "${DB_NAME}" > "$NEW_BACKUP"
              echo "Respaldo generado con éxito: $(basename "$NEW_BACKUP")"
            else
              echo "Advertencia: Contenedor ${DB_CONTAINER} no está activo. Saltando respaldo."
            fi
            
            # Detener contenedores
            docker compose -f docker-compose-prepro.yml down || true
            
            # Descargar nuevas imágenes y recrear contenedores desde cero
            docker compose -f docker-compose-prepro.yml pull
            docker compose -f docker-compose-prepro.yml up -d --force-recreate
            
            # --- Automatización de Base de Datos ---
            # El esquema se sincroniza automáticamente mediante Sequelize (sequelize.sync({ alter: true })) al iniciar la app.
            echo "Esperando 15 segundos a que la app inicie y sincronice la base de datos..."
            sleep 15
            
            # Se deshabilita la ejecución automática del seeder en preproducción para proteger los datos
            # echo "Poblando base de datos con database/seed.js..."
            # docker exec prepro-capacitaciones-m-api node database/seed.js || echo "Skip seed"
            
            # Limpieza de imágenes antiguas para optimizar espacio
            docker image prune -f
            
            echo "🚀 Sistema desplegado correctamente."
