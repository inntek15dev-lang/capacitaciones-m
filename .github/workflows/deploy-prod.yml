name: CI/CD CAPACITACIONES-M - Prod

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}-api
  IMAGE_FRONT: ghcr.io/${{ github.repository }}-front

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Log in al GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: ./back/Dockerfile.back
          push: true
          tags: ${{ env.IMAGE_API }}:latest

      - name: Create Frontend .env file
        run: |
          echo "VITE_API_URL=https://capacitaciones-m-api.ovalcontrol.com/api/v1" > ./front/.env
          echo "Frontend .env created with API URL: \$(cat ./front/.env)"
        # La URL del API debe ser la de producción.

      - name: Build y Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile.front
          push: true
          tags: ${{ env.IMAGE_FRONT }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Fix permissions on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /home/DOCKERS-PROD/CAPACITACIONES-M/
            sudo chown -R ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} /home/DOCKERS-PROD/CAPACITACIONES-M/
            sudo chmod -R 775 /home/DOCKERS-PROD/CAPACITACIONES-M/

      - name: Copiar docker-compose al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-prod.yml"
          target: "/home/DOCKERS-PROD/CAPACITACIONES-M/"
          overwrite: true

      - name: Ejecutar despliegue vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/DOCKERS-PROD/CAPACITACIONES-M
            
            # Login en el registro de GitHub
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Detener contenedores
            docker compose -f docker-compose-prod.yml down || true
            
            # Descargar nuevas imágenes y recrear contenedores desde cero
            docker compose -f docker-compose-prod.yml pull
            docker compose -f docker-compose-prod.yml up -d --force-recreate
            
            # --- Automatización de Base de Datos ---
            # El esquema se sincroniza automáticamente mediante Sequelize (sequelize.sync({ alter: true })) al iniciar la app.
            echo "Esperando 15 segundos a que la app inicie y sincronice la base de datos..."
            sleep 15
            
            # Se deshabilita la ejecución automática del seeder en producción para proteger los datos
            # echo "Poblando base de datos con database/seed.js..."
            # docker exec capacitaciones-m-api node database/seed.js || echo "Skip seed"
            
            # Limpieza de imágenes antiguas para optimizar espacio
            docker image prune -f
            
            echo "🚀 Sistema desplegado correctamente."
